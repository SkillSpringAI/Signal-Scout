<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Signal Scout live architecture</title>
  <desc id="desc">A compact architecture diagram connecting the React browser interface to the Node API on Cloud Run, public Devpost and GitHub sources, Gemini 3.5 Flash, Firestore Native, and Secret Manager.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#183b4d"/>
    </marker>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#0d1b2a}.subtitle{font:400 20px Arial,sans-serif;fill:#53657a}
      .label{font:700 23px Arial,sans-serif;fill:#0d1b2a}.copy{font:400 18px Arial,sans-serif;fill:#41556c}
      .small{font:600 16px Arial,sans-serif;fill:#53657a}.flow{stroke:#183b4d;stroke-width:4;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
      .oneway{stroke:#183b4d;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="760" rx="24" fill="#fbfaf7"/>
  <text x="70" y="72" class="title">Signal Scout — Live Architecture</text>
  <text x="70" y="108" class="subtitle">One server-side path from public evidence to a sourced, persistent recommendation.</text>

  <rect x="70" y="270" width="250" height="150" rx="18" fill="#ffffff" stroke="#d39a4a" stroke-width="3"/>
  <text x="195" y="320" text-anchor="middle" class="label">Builder / Judge</text>
  <text x="195" y="354" text-anchor="middle" class="copy">React + TypeScript UI</text>
  <text x="195" y="384" text-anchor="middle" class="small">browser · no credentials</text>

  <rect x="415" y="178" width="570" height="340" rx="24" fill="#edf4f5" stroke="#183b4d" stroke-width="4"/>
  <text x="700" y="222" text-anchor="middle" class="label">Google Cloud Run</text>
  <text x="700" y="252" text-anchor="middle" class="small">Signal Scout service · dedicated runtime identity</text>
  <rect x="470" y="292" width="190" height="136" rx="16" fill="#ffffff" stroke="#8caab5" stroke-width="2"/>
  <text x="565" y="334" text-anchor="middle" class="label">Node API</text>
  <text x="565" y="368" text-anchor="middle" class="copy">HTTPS + JSON</text>
  <text x="565" y="398" text-anchor="middle" class="small">poll · feedback · clarify</text>
  <rect x="715" y="292" width="215" height="136" rx="16" fill="#ffffff" stroke="#8caab5" stroke-width="2"/>
  <text x="822" y="326" text-anchor="middle" class="label">Agent workflow</text>
  <text x="822" y="360" text-anchor="middle" class="copy">retrieve → analyze</text>
  <text x="822" y="389" text-anchor="middle" class="copy">validate → report → adapt</text>
  <line x1="660" y1="360" x2="715" y2="360" class="flow"/>
  <rect x="480" y="458" width="440" height="38" rx="19" fill="#183b4d"/>
  <text x="700" y="483" text-anchor="middle" style="font:600 15px Arial,sans-serif;fill:#ffffff">usage limits · safe retrieval · schema validation</text>

  <rect x="1080" y="150" width="250" height="126" rx="18" fill="#fff7eb" stroke="#d39a4a" stroke-width="3"/>
  <text x="1205" y="192" text-anchor="middle" class="label">Public sources</text>
  <text x="1205" y="226" text-anchor="middle" class="copy">Devpost + GitHub</text>
  <text x="1205" y="254" text-anchor="middle" class="small">untrusted evidence</text>

  <rect x="1080" y="318" width="250" height="126" rx="18" fill="#ffffff" stroke="#7896d8" stroke-width="3"/>
  <text x="1205" y="360" text-anchor="middle" class="label">Gemini 3.5 Flash</text>
  <text x="1205" y="394" text-anchor="middle" class="copy">Google GenAI SDK</text>
  <text x="1205" y="422" text-anchor="middle" class="small">structured response</text>

  <rect x="1080" y="486" width="250" height="126" rx="18" fill="#ffffff" stroke="#6ca487" stroke-width="3"/>
  <text x="1205" y="528" text-anchor="middle" class="label">Firestore Native</text>
  <text x="1205" y="562" text-anchor="middle" class="copy">scan · Activity · report</text>
  <text x="1205" y="590" text-anchor="middle" class="small">feedback + clarification</text>

  <rect x="415" y="590" width="300" height="98" rx="18" fill="#ffffff" stroke="#8caab5" stroke-width="3"/>
  <text x="565" y="630" text-anchor="middle" class="label">Secret Manager</text>
  <text x="565" y="662" text-anchor="middle" class="small">Gemini key reference · server-side only</text>

  <line x1="320" y1="345" x2="470" y2="345" class="flow"/>
  <path d="M 930 324 C 1000 300, 1015 228, 1080 214" class="flow"/>
  <line x1="930" y1="378" x2="1080" y2="378" class="flow"/>
  <path d="M 930 414 C 1000 438, 1015 540, 1080 548" class="flow"/>
  <path d="M 565 590 L 565 518" class="oneway"/>

  <text x="70" y="724" class="small">Live path only. Mock mode is a visibly separate synthetic fixture and is never presented as submission evidence.</text>
</svg>
